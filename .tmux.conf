# ==============================================================================
# TMUX CONFIGURATION FOR MULTI-AGENT / MULTI-TASKING WORKFLOWS (AGY CLI)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Prefix Key
# ------------------------------------------------------------------------------
# Use Ctrl-a as primary prefix (ergonomic, screen-like)
set -g prefix C-a
unbind C-b
bind a send-prefix

# Fast toggle between current and previous window
bind C-a last-window

# ------------------------------------------------------------------------------
# 2. General Settings & Responsiveness
# ------------------------------------------------------------------------------
# Eliminate Esc delay (crucial for CLI agent prompts, modal editors, and TUI)
set -s escape-time 10

# Massive scrollback buffer for long agent outputs, test logs, and diffs
set -g history-limit 100000

# Enable full mouse support (scroll, click to select pane, drag to resize)
set -g mouse on

# Terminal color & true-color (RGB) support for Ghostty, iTerm2, Alacritty, Kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:hyperlinks"

# Enable focus events for applications that support it
set -g focus-events on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Activity monitoring across background windows
setw -g monitor-activity on
set -g visual-activity off

# Reload config shortcut
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ------------------------------------------------------------------------------
# 3. Splits & Navigation (Keep Current Working Directory)
# ------------------------------------------------------------------------------
# Intuitive splits
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane switching (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane resizing (Prefix + H/J/K/L with repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Full-screen / Zoom current pane toggle (Prefix + z or Prefix + Space)
bind Space resize-pane -Z

# ------------------------------------------------------------------------------
# 4. Multi-Tasking & Agent Management Enhancements
# ------------------------------------------------------------------------------
# Synchronize panes toggle (Send input to ALL panes at once - useful for updates/batch commands)
bind S setw synchronize-panes \; display-message "Panes synchronized: #{?pane_synchronized,ON,OFF}"

# Dynamic top pane borders showing Pane ID and Title (e.g. task name or running process)
set -g pane-border-status top
set -g pane-border-format " #[fg=colour39,bold]#{pane_index}#[default] #[fg=colour245]|#[default] #[fg=colour222]#{?pane_title,#{pane_title},#{pane_current_command}}#[default] "

# Quick rename pane title shortcut (Prefix + T)
bind T command-prompt -p "Rename pane task/title:" "select-pane -T '%%'"

# Break pane into its own window (Prefix + b) or join pane (Prefix + B)
bind b break-pane
bind B command-prompt -p "Join pane from [session:window.pane]:" "join-pane -s '%%'"

# Quick layouts for multitasking (Prefix + Alt+1..5, preserving Prefix + 1..5 for windows)
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ------------------------------------------------------------------------------
# 5. macOS Clipboard & Vi Copy Mode
# ------------------------------------------------------------------------------
setw -g mode-keys vi

# Better copy mode keybindings
# Keep drag-select from clobbering the system clipboard (aligned with Ghostty copy-on-select=false);
# use `y` in copy-mode-vi to copy explicitly.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi MouseDragEnd1Pane

# Paste directly from system clipboard using Prefix + P (bracketed paste)
bind P run "pbpaste | tmux load-buffer - && tmux paste-buffer -p"

# ------------------------------------------------------------------------------
# 6. Status Bar & Theme (Clean, Modern Dark Aesthetic)
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 3
set -g status-justify left

# Bar colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left status: Session name & synchronization status
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#89b4fa]#{?pane_synchronized,#[bg=#f38ba8]#[fg=#11111b] SYNC #[default],} "

# Window list formatting
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I:#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#cba6f7,bold] #I:#W #[default]"
setw -g window-status-activity-style "fg=#fab387,bg=#1e1e2e,bold"

# Right status: Directory + Date/Time
set -g status-right-length 80
set -g status-right "#[fg=#a6adc8,bg=#313244] %Y-%m-%d %H:%M #[bg=#b4befe,fg=#11111b,bold] #{b:pane_current_path} "

# Border styling
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
